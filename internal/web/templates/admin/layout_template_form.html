{{ define "content" }}
<h1>Create Template</h1>
{{ if .Content.Error }}<p class="form-error" role="alert">{{ .Content.Error }}</p>{{ end }}
<form method="post" action="{{ .Content.Action }}">
  <input type="hidden" name="csrf_token" value="{{ .Content.CSRFToken }}">
  <label>Name<input type="text" name="name" value="{{ .Content.Name }}" required></label>
  <label>Content Type
    <select name="content_type_id" required>
      <option value="">Select content type</option>
      {{ range .Content.ContentTypes }}<option value="{{ .ID }}" {{ if eq $.Content.ContentTypeID .ID }}selected{{ end }}>{{ .DisplayName }}</option>{{ end }}
    </select>
  </label>
  <label>Parent template (optional)
    <select name="parent_template_id">
      <option value="">— No parent —</option>
      {{ range .Content.ParentOptions }}<option value="{{ .ID }}" {{ if eq $.Content.ParentID .ID }}selected{{ end }}>{{ .Name }}</option>{{ end }}
    </select>
    <p class="field-desc">Parent → Child → Entry. Parent must be published, same content type, and not create a cycle. Depth limit is 8.</p>
  </label>
  <div class="form-actions">
    <a class="button" href="{{ .Content.BackURL }}">Cancel</a>
    <button class="button button-primary" type="submit">Create template</button>
  </div>
</form>
{{ end }}
