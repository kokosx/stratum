{{ define "layout.html" }}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ .Title }} · Stratum</title>
  <meta name="csrf-token" content="{{ .CSRFToken }}">
  <link rel="stylesheet" href="/admin/static/admin.css">
  <link rel="stylesheet" href="/admin/static/editor/editor.css">
  <link rel="stylesheet" href="/admin/static/appearance/customizer.css">
  <script type="module" src="/admin/static/admin/datastar.js"></script>
</head>
<body>
  <div class="admin">
    <button class="sidebar-toggle" type="button" aria-expanded="false" aria-controls="admin-sidebar" aria-label="Toggle navigation">
      <span aria-hidden="true">&#9776;</span>
    </button>
    <aside id="admin-sidebar" class="sidebar">
      <a class="brand" href="/admin">Stratum</a>
      <nav aria-label="Admin navigation">
        <ul class="menu">
          <li><a href="/admin" {{ if eq .ActiveMenu "dashboard" }}class="active" aria-current="page"{{ end }}>Dashboard</a></li>
          <li><a href="/admin/pages" {{ if eq .ActiveMenu "pages" }}class="active" aria-current="page"{{ end }}>Pages</a></li>
          <li><a href="/admin/posts" {{ if eq .ActiveMenu "posts" }}class="active" aria-current="page"{{ end }}>Posts</a></li>
          <li><a href="/admin/appearance" {{ if eq .ActiveMenu "appearance" }}class="active" aria-current="page"{{ end }}>Appearance</a></li>
          <li><a href="/admin/media" {{ if eq .ActiveMenu "media" }}class="active" aria-current="page"{{ end }}>Media</a></li>
          <li><a href="/admin/menus" {{ if eq .ActiveMenu "menus" }}class="active" aria-current="page"{{ end }}>Menus</a></li>
          <li><a href="/admin/settings" {{ if eq .ActiveMenu "settings" }}class="active" aria-current="page"{{ end }}>Settings</a></li>
        </ul>
      </nav>
    </aside>
    <main class="main">
      <header class="topbar">
        <span>StratumCMS administration</span>
        <form method="post" action="/admin/logout">
          <input type="hidden" name="csrf_token" value="{{ .CSRFToken }}">
          <button class="logout-button" type="submit">Log out</button>
        </form>
      </header>
      <div class="content">{{ if .Flash }}<div class="flash-message" role="status">{{ .Flash }}</div>{{ end }}{{ template "content" . }}</div>
      <div id="admin-toast-region" class="toast-region" aria-live="polite"></div>
    </main>
  </div>
  <script>
    // P1.47: Mobile admin sidebar toggle
    document.querySelector('.sidebar-toggle')?.addEventListener('click', function() {
      var sidebar = document.getElementById('admin-sidebar');
      var open = this.getAttribute('aria-expanded') !== 'true';
      this.setAttribute('aria-expanded', String(open));
      sidebar.classList.toggle('is-open', open);
    });
    document.addEventListener('keydown', function(e) {
      if (e.key !== 'Escape') return;
      var toggle = document.querySelector('.sidebar-toggle');
      if (toggle.getAttribute('aria-expanded') === 'true') {
        toggle.setAttribute('aria-expanded', 'false');
        document.getElementById('admin-sidebar').classList.remove('is-open');
        toggle.focus();
      }
    });
  </script>
  <script src="/admin/static/admin/toast.js"></script>
  <script src="/admin/static/admin/media-picker.js" defer></script>
</body>
</html>
{{ end }}
