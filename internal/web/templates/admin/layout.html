{{ define "layout.html" }}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ .Title }} · Stratum</title>
  <meta name="csrf-token" content="{{ .CSRFToken }}">
  <link rel="stylesheet" href="/admin/static/admin.css">
  <link rel="stylesheet" href="/admin/static/editor/editor.css">
  <link rel="stylesheet" href="/admin/static/appearance/customizer.css">
  <script type="module" src="https://cdn.jsdelivr.net/gh/starfederation/datastar@v1.0.2/bundles/datastar.js"></script>
</head>
<body>
  <div class="admin">
    <aside class="sidebar">
      <a class="brand" href="/admin">Stratum</a>
      <nav aria-label="Admin navigation">
        <ul class="menu">
          <li><a href="/admin" class="{{ if eq .ActiveMenu "dashboard" }}active{{ end }}">Dashboard</a></li>
          <li><a href="/admin/pages" class="{{ if eq .ActiveMenu "pages" }}active{{ end }}">Pages</a></li>
          <li><a href="/admin/posts" class="{{ if eq .ActiveMenu "posts" }}active{{ end }}">Posts</a></li>
          <li><a href="/admin/appearance" class="{{ if eq .ActiveMenu "appearance" }}active{{ end }}">Appearance</a></li>
          <li><a href="/admin/media" class="{{ if eq .ActiveMenu "media" }}active{{ end }}">Media</a></li>
          <li class="menu-child"><a href="/admin/menus" class="{{ if eq .ActiveMenu "menus" }}active{{ end }}">Menus</a></li>
          <li><a href="/admin/settings" class="{{ if eq .ActiveMenu "settings" }}active{{ end }}">Settings</a></li>
        </ul>
      </nav>
    </aside>
    <main class="main">
      <header class="topbar">
        <span>StratumCMS administration</span>
        <form method="post" action="/admin/logout">
          <input type="hidden" name="csrf_token" value="{{ .CSRFToken }}">
          <button class="logout-button" type="submit">Log out</button>
        </form>
      </header>
      <div class="content">{{ if .Flash }}<div class="flash-message" role="status">{{ .Flash }}</div>{{ end }}{{ template "content" . }}</div>
      <div id="admin-toast-region" class="toast-region" aria-live="polite"></div>
    </main>
  </div>
  <script src="/admin/static/admin/toast.js"></script>
  <script src="/admin/static/admin/media-picker.js" defer></script>
  </body>
</html>
{{ end }}
