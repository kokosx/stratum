{{ define "content" }}
<header class="admin-page-header"><div><h1>{{ if .Content.IsEdit }}Edit redirect{{ else }}Add redirect{{ end }}</h1></div><div class="admin-page-actions"><a class="button" href="{{ .Content.BackURL }}">Back</a></div></header>
{{ if .Content.Error }}<div class="notice notice-danger" role="alert">{{ .Content.Error }}</div>{{ end }}
<form method="post" action="{{ if .Content.IsEdit }}/admin/tools/redirects/{{ .Content.ID }}{{ else }}/admin/tools/redirects{{ end }}" class="admin-section admin-form-card">
  <input type="hidden" name="csrf_token" value="{{ .Content.CSRFToken }}">
  <div class="form-group"><label class="form-label" for="source">Source</label><input class="form-control" type="text" id="source" name="source" value="{{ .Content.Source }}" placeholder="/old-page" required><p class="form-help">Local absolute path, must start with /.</p></div>
  <div class="form-group"><label class="form-label" for="destination">Destination</label><input class="form-control" type="text" id="destination" name="destination" value="{{ .Content.Target }}" placeholder="/new-page or https://example.com" required><p class="form-help">Internal path or http(s) URL.</p></div>
  <div class="form-group"><label class="form-label">Type</label><label class="check-row"><input type="radio" name="status" value="301" {{ if ne .Content.Status 302 }}checked{{ end }}> Permanent (301)</label><label class="check-row"><input type="radio" name="status" value="302" {{ if eq .Content.Status 302 }}checked{{ end }}> Temporary (302)</label></div>
  <div class="admin-page-actions"><button type="submit" class="button button-primary">{{ if .Content.IsEdit }}Save changes{{ else }}Create redirect{{ end }}</button><a class="button" href="{{ .Content.BackURL }}">Cancel</a></div>
</form>
{{ end }}
