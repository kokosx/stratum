{{ define "content" }}
<header class="admin-page-header"><div><h1>{{ .Content.Heading }}</h1></div></header>
{{ if .Content.Error }}<p class="form-error" role="alert">{{ .Content.Error }}</p>{{ end }}
<form method="post" action="{{ .Content.Action }}" class="admin-section">
  <input type="hidden" name="csrf_token" value="{{ .Content.CSRFToken }}">
  <div class="form-group">
    <label class="form-label" for="site-part-name">Name</label><input class="form-control" id="site-part-name" name="name" value="{{ .Content.Name }}" required>
    {{ if .Content.Location }}<input type="hidden" name="location" value="{{ .Content.Location }}">{{ end }}
  </div>
  <div class="admin-page-actions">
    <a class="button button-secondary" href="{{ .Content.BackURL }}">Back</a>
    <button class="button button-primary" type="submit">Create</button>
  </div>
</form>
{{ end }}
